[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "sam2"
version = "0.0.0"
description = "Sam2"
readme = "README.md"
authors = ["CheckAndVisit"]
include = [
    {path = "sam2/py.typed"},
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[tool.poetry.extras]
cpu = [
    "torch",
    "torchvision"
]
cuda = [
    "torch",
    "torchvision"
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
torch = [
    { version = "2.6.0", markers = "extra == 'cpu' and extra != 'cuda'", source = "pytorch-cpu"},
    { version = "2.6.0", markers = "extra == 'cuda' and extra != 'cpu'", source = "pytorch-cuda"}
]
torchvision = [
    { markers = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.11'", url="https://download.pytorch.org/whl/cpu/torchvision-0.21.0-cp311-cp311-linux_aarch64.whl"},
    { markers = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.12'", url="https://download.pytorch.org/whl/cpu/torchvision-0.21.0-cp312-cp312-linux_aarch64.whl"},
    { version = "0.21.0", markers = "(sys_platform != 'linux' or platform_machine != 'aarch64') and (extra == 'cpu' and extra != 'cuda')", source = "pytorch-cpu"},
    { version = "0.21.0", markers = "(sys_platform != 'linux' or platform_machine != 'aarch64') and (extra == 'cuda' and extra != 'cpu')", source = "pytorch-cuda"}
]
groundingdino = { path = "./grounding_dino/", develop=true }
supervision = ">=0.22.0"
numpy = ">=1.24.4"
tqdm = ">=4.66.1"
hydra-core = ">=1.3.2"
iopath = ">=0.1.10"
pillow = ">=9.4.0"
transformers = ">=4.35.2"
addict = "*"
yapf = "*"
timm = "*"
pycocotools = "*"
